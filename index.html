<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
  :root{
    --ink:#20242A; --paper:#F4F2EC; --panel:#FFFFFF; --line:#D8D3C6;
    --safety:#D9622B; --safety-ink:#7A3113; --steel:#3C5A73; --ok:#3F7A54; --warn:#B4392A;
    --muted:#6B7078; --radius:3px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Source Sans 3', sans-serif; font-size:15px; line-height:1.45; }
  h1,h2,h3,.display{ font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.2px; margin:0; }
  .app{display:flex; min-height:100vh;}
  .side{ width:220px; flex-shrink:0; background:var(--ink); color:#EFEDE6; padding:22px 16px; display:flex; flex-direction:column; gap:24px; }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .mark{ font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:26px; color:#fff; }
  .brand .sub{ font-size:12.5px; color:#B7BCC4; }
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav button{ all:unset; cursor:pointer; padding:9px 10px; border-radius:var(--radius); color:#D3D6DA; font-size:14.5px; border-left:3px solid transparent; }
  .nav button:hover{ background:#2C3138; }
  .nav button.active{ background:#2C3138; color:#fff; border-left:3px solid var(--safety); font-weight:600; }
  .side .newjob{ margin-top:auto; background:var(--safety); color:#fff; border:none; padding:11px 12px; border-radius:var(--radius); font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; cursor:pointer; letter-spacing:0.3px; }
  .side .newjob:active{ transform:translateY(1px); }
  .bottombar{ display:none; }
  main{ flex:1; padding:28px 34px; max-width:980px; }
  .pagehead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
  .pagehead h1{ font-size:30px; }
  .pagehead .count{ color:var(--muted); font-size:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--steel); border-radius:var(--radius); padding:14px 16px; }
  .stat .n{ font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; line-height:1; }
  .stat .l{ color:var(--muted); font-size:13px; margin-top:4px; }
  .joblist-item{ display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .joblist-item:last-child{ border-bottom:none; }
  .joblist-item:hover{ background:#FAF8F3; }
  .jl-left .cust{ font-weight:600; }
  .jl-left .meta{ color:var(--muted); font-size:13px; margin-top:2px;}
  .status{ font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; border:1px solid transparent; }
  .status.Scheduled{ background:#EEF2F5; color:var(--steel); border-color:#C9D6DE;}
  .status.In-Progress{ background:#FBF0E4; color:var(--safety-ink); border-color:#EAD0B4;}
  .status.Complete{ background:#EAF3EC; color:var(--ok); border-color:#C7DECB;}
  label{ display:block; font-size:12.5px; color:var(--muted); margin:0 0 4px; font-weight:600;}
  input,select,textarea{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); font-family:inherit; font-size:14.5px; background:#fff; color:var(--ink); }
  textarea{ resize:vertical; }
  .field{ margin-bottom:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }
  .btn{ border:1px solid var(--ink); background:var(--ink); color:#fff; padding:9px 16px; border-radius:var(--radius); font-weight:600; cursor:pointer; font-size:14px; }
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn.safety{ background:var(--safety); border-color:var(--safety); }
  .btn.small{ padding:5px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn:active{ transform:translateY(1px); }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button{ all:unset; cursor:pointer; padding:9px 14px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs button.active{ color:var(--ink); border-bottom:2px solid var(--safety); font-weight:600; }
  .back{ all:unset; cursor:pointer; color:var(--steel); font-size:13.5px; font-weight:600; margin-bottom:10px; display:inline-block; }
  .empty{ color:var(--muted); padding:30px 0; text-align:center; font-size:14px; }
  .note{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .divider{ height:1px; background:var(--line); margin:16px 0; }
  .result-pill{ display:inline-block; padding:6px 12px; border-radius:var(--radius); font-weight:700; font-size:13px;}
  .result-safe{ background:#EAF3EC; color:var(--ok); }
  .result-atrisk{ background:#FBF0E4; color:var(--safety-ink); }
  .result-id{ background:#F7E6E4; color:var(--warn); }
  .hidden{ display:none !important; }
  .customer-card{ border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
  .customer-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; cursor:pointer; background:#fff; }
  .customer-head:hover{ background:#FAF8F3; }
  .customer-head .name{ font-weight:600; }
  .customer-head .meta{ color:var(--muted); font-size:13px; }
  .customer-body{ padding:0 16px 16px; border-top:1px solid var(--line); background:#FCFBF8; }
  .appliance-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .appliance-row:last-child{ border-bottom:none; }
  .appliance-row .t{ font-weight:600; font-size:13.5px; }
  .appliance-row .m{ color:var(--muted); font-size:12.5px; }
  .apform{ background:#fff; border:1px dashed var(--line); border-radius:var(--radius); padding:14px; margin-top:12px; }
  .badge-thumb{ max-width:140px; max-height:100px; border:1px solid var(--line); border-radius:var(--radius); display:block; margin-top:6px; }
  @media (max-width:820px){
    .app{ flex-direction:column; }
    .side{ width:100%; flex-direction:row; align-items:center; justify-content:space-between; padding:12px 14px; gap:14px; }
    .brand{ flex-direction:row; align-items:baseline; gap:8px; }
    .side .nav{ display:none; }
    .side .newjob{ margin-top:0; padding:9px 14px; font-size:15px; flex-shrink:0; }
    main{ padding:18px; padding-bottom:78px; }
    .pagehead h1{ font-size:24px; }
    .bottombar{ display:flex; position:fixed; left:0; right:0; bottom:0; background:var(--ink); border-top:1px solid #363B43; z-index:20; }
    .bottombar button{ all:unset; flex:1; text-align:center; padding:12px 4px 10px; color:#C6CACF; font-size:12.5px; cursor:pointer; border-top:2px solid transparent; }
    .bottombar button.active{ color:#fff; font-weight:700; border-top:2px solid var(--safety); }
  }
  #printArea{ display:none; }
  .pr-note{ font-size:11.5px; color:var(--muted); margin:4px 0 14px; }
  .pr-table{ width:100%; border-collapse:collapse; margin-bottom:14px; font-size:12.5px; }
  .pr-table th{ background:#EEE; text-align:left; padding:5px 8px; border:1px solid #999; }
  .pr-table td{ padding:4px 8px; border:1px solid #999; }
  .pr-table td:nth-child(odd){ width:40%; color:#333; font-weight:600; }
  .pr-grid{ width:100%; border-collapse:collapse; margin-bottom:14px; font-size:10.5px; }
  .pr-grid th{ background:#EEE; text-align:left; padding:4px 5px; border:1px solid #999; }
  .pr-grid td{ padding:4px 5px; border:1px solid #999; }
  .comb-row{ margin-bottom:10px; }
  .comb-row label{ display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:4px; }
  .comb-inputs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; left:0; top:0; width:100%; padding:20px; }
    #printArea h1{ font-size:22px; margin-bottom:4px; }
  }
</style>
</head>
<body>
<div id="fallbackBanner" style="background:#EEF2F5; color:var(--steel); padding:7px 16px; font-size:12.5px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; text-align:center;">
  <span>Saved on this device only — use Export/Import to carry data to your phone.</span>
  <button class="btn small secondary" id="exportBtn">Export backup</button>
  <button class="btn small secondary" id="importBtn">Import backup</button>
</div>
<div id="backupOverlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div class="card" style="max-width:600px; width:100%; max-height:80vh; overflow:auto;">
    <h2 id="backupTitle" style="font-size:18px; margin-bottom:10px;"></h2>
    <div id="backupBody"></div>
    <button class="btn secondary small" id="closeBackupBtn" style="margin-top:12px;">Close</button>
  </div>
</div>
<div id="printArea"></div>
<div id="recordOverlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;">
  <div class="card" style="max-width:760px; width:100%; max-height:90vh; overflow:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap;">
      <h2 style="font-size:18px;" id="recordOverlayTitle">Safety record preview</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn safety small" id="printFromPreviewBtn">Print / Save as PDF</button>
        <button class="btn secondary small" id="closeRecordBtn">Close</button>
      </div>
    </div>
    <div id="recordOverlayBody"></div>

<div class="app">
  <div class="side">
    <div class="brand"><div class="mark">Callout</div><div class="sub">Job folder & compliance hub</div></div>
    <div class="nav">
      <button data-view="dashboard" class="active">Dashboard</button>

<script>
let state = { view: 'dashboard', jobId: null, jobTab: 'overview', expandedCustomer: null, addingApplianceFor: null, newJobCustomerId: '', pendingEvent: null, editingJob: false, completionApplianceKey: null };
let jobCache = {};
let badgeImageData = null; // {base64, mediaType} for the appliance form currently open
let manualSearchResult = null; // last findManualOnline() result for the appliance form currently open
let editingAppliance = null; // the existing appliance record being edited, or null when adding a new one

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- Storage layer: this device's own browser storage. Reliable now that the
// app runs from a real hosted address, but it's per-device — that's what the
// Export/Import backup is for (moving data to another device). ----
const LS_PREFIX = 'callout:';
async function dbGet(key){
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v!==null ? { key, value:v } : null; }
  catch(err){ console.error('storage get failed', err); return null; }
}
async function dbSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, value); return { key, value }; }
  catch(err){ console.error('storage set failed', err); alert('Could not save — your browser storage may be full or blocked (private browsing can cause this).'); return null; }
}
async function dbList(prefix){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX)){
        const bare = k.slice(LS_PREFIX.length);
        if(!prefix || bare.startsWith(prefix)) keys.push(bare);
      }
    }
    return { keys };
  }catch(err){ console.error('storage list failed', err); return { keys: [] }; }
}

async function loadAll(prefix){
  const res = await dbList(prefix);
  if(!res || !res.keys || !res.keys.length) return [];
  const items = [];
  for(const k of res.keys){
    try{
      const r = await dbGet(k);
      if(r && r.value){
        const obj = JSON.parse(r.value);
        items.push(obj);
        if(prefix==='job:') jobCache[obj.id] = obj;
      }
    }catch(e){}
  }
  return items;
}
async function saveJob(job){ jobCache[job.id] = job; return await dbSet('job:'+job.id, JSON.stringify(job)); }
async function saveCustomer(c){ return await dbSet('customer:'+c.id, JSON.stringify(c)); }
async function saveAppliance(a){ return await dbSet('appliance:'+a.id, JSON.stringify(a)); }

// ---- Backup / restore (moves data between devices, since storage is per-device) ----
function collectAllData(){
  const out = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(LS_PREFIX)) out[k.slice(LS_PREFIX.length)] = localStorage.getItem(k);
  }
  return out;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}
function downloadBackup(json){
  const blob = new Blob([json], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'callout-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
function showExportOverlay(){
  document.getElementById('backupOverlay').classList.remove('hidden');
  document.getElementById('backupTitle').textContent = 'Export backup';
  const json = JSON.stringify(collectAllData());
  document.getElementById('backupBody').innerHTML =
    `<p class="note">Easiest option: download it as a file, then use "Import backup" \u2192 "Choose file" on your other device. Copy-to-clipboard also works but can be slow with a lot of data (photos especially).</p>
     <div style="display:flex; gap:8px; margin-bottom:10px;">
       <button class="btn safety small" id="downloadBackupBtn">Download backup file</button>
       <button class="btn secondary small" id="copyBackupBtn">Copy to clipboard</button>
     </div>
     <div class="note" id="copyStatus"></div>
     <details style="margin-top:8px;"><summary class="note" style="cursor:pointer;">Show raw text (manual copy)</summary>
       <textarea readonly rows="8" style="font-family:monospace; font-size:12px; margin-top:6px;" onclick="this.select()">${esc(json)}</textarea>
     </details>`;
  document.getElementById('downloadBackupBtn').addEventListener('click', ()=> downloadBackup(json));
  document.getElementById('copyBackupBtn').addEventListener('click', async ()=>{
    const ok = await copyText(json);
    document.getElementById('copyStatus').textContent = ok ? 'Copied — paste it somewhere safe.' : "Couldn't copy automatically — use Download instead, or the raw text box below.";
  });
}
function showImportOverlay(){
  document.getElementById('backupOverlay').classList.remove('hidden');
  document.getElementById('backupTitle').textContent = 'Import backup';
  document.getElementById('backupBody').innerHTML =
    `<p class="note">Choose a previously downloaded backup file, or paste one below. This adds to what's already here (matching records are overwritten).</p>
     <input type="file" accept=".json,application/json" id="importFile" style="margin-bottom:10px;">
     <details><summary class="note" style="cursor:pointer;">Paste instead</summary>
       <textarea id="importBox" rows="8" style="font-family:monospace; font-size:12px; margin-top:6px;"></textarea>
       <button class="btn safety small" id="loadBackupBtn" style="margin-top:8px;">Load pasted backup</button>
     </details>`;
  function loadBackupData(parsed){
    try{
      Object.entries(parsed).forEach(([k,v])=> localStorage.setItem(LS_PREFIX+k, v));
      document.getElementById('backupOverlay').classList.add('hidden');
      alert('Backup loaded.');
      render();
    }catch(err){ alert("That didn't look like a valid backup."); }
  }
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { try{ loadBackupData(JSON.parse(reader.result)); }catch(err){ alert("That file didn't look like a valid backup."); } };
    reader.readAsText(file);
  });
  document.getElementById('loadBackupBtn').addEventListener('click', ()=>{
    try{ loadBackupData(JSON.parse(document.getElementById('importBox').value)); }
    catch(err){ alert("That didn't look like a valid backup — check you copied the whole thing."); }
  });
}
document.getElementById('exportBtn').addEventListener('click', showExportOverlay);
document.getElementById('importBtn').addEventListener('click', showImportOverlay);
document.getElementById('closeBackupBtn').addEventListener('click', ()=> document.getElementById('backupOverlay').classList.add('hidden'));

// ---- Google Calendar ----
const GOOGLE_CLIENT_ID = '65416956502-1grdlilp1crjkfnqsr9vhtorenj6fa9g.apps.googleusercontent.com';
let gcalToken = null;
let gcalTokenClient = null;
let lastCalEvents = [];
let gapiInited = false;

function waitForGapi(){
  return new Promise((resolve, reject)=>{
    if(window.gapi){ resolve(); return; }
    let tries = 0;
    const t = setInterval(()=>{
      tries++;
      if(window.gapi){ clearInterval(t); resolve(); }
      else if(tries > 80){ clearInterval(t); reject(new Error("Google's library didn't load — check your connection and try again.")); }
    }, 100);
  });
}
async function loadGapiClient(){
  if(gapiInited) return;
  await waitForGapi();
  await new Promise((resolve, reject)=> gapi.load('client', { callback: resolve, onerror: ()=>reject(new Error("Google's client library failed to load.")) }));
  await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest');
  gapiInited = true;
}
function ensureTokenClient(){
  if(gcalTokenClient) return gcalTokenClient;
  gcalTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: (resp)=>{ if(resp && resp.access_token){ gcalToken = resp.access_token; render(); } }
  });
  return gcalTokenClient;
}
function connectCalendar(){ ensureTokenClient().requestAccessToken(); }
function disconnectCalendar(){
  if(gcalToken && window.google && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(gcalToken, ()=>{});
  gcalToken = null; render();
}
async function fetchCalendarEvents(){
  if(!gcalToken) return [];
  await loadGapiClient();
  gapi.client.setToken({ access_token: gcalToken });
  try{
    const resp = await gapi.client.calendar.events.list({
      calendarId: 'primary',
      timeMin: new Date().toISOString(),
      maxResults: 20,
      singleEvents: true,
      orderBy: 'startTime'
    });
    return ((resp.result && resp.result.items) || []).filter(ev => ev.eventType !== 'birthday');
  }catch(err){
    console.error('calendar api error', err);
    if(err.status === 401){ gcalToken = null; throw new Error('Your Google session expired — reconnect.'); }
    const msg = err.result && err.result.error && err.result.error.message;
    throw new Error(msg || 'Could not load calendar events.');
  }
}
async function renderCalendar(main){
  main.innerHTML = `<div class="pagehead"><h1>Calendar</h1></div><div class="card" id="calCard"><div class="empty">Loading…</div></div>`;
  const card = document.getElementById('calCard');
  if(!gcalToken){
    card.innerHTML = `<p class="note">Connect your Google Calendar to see upcoming bookings here and turn any of them into a job folder.</p>
      <button class="btn safety" id="connectCalBtn">Connect Google Calendar</button>`;
    document.getElementById('connectCalBtn').addEventListener('click', connectCalendar);
    return;
  }
  try{
    lastCalEvents = await fetchCalendarEvents();
    if(!lastCalEvents.length){
      card.innerHTML = `<div class="empty">No upcoming events found on your calendar.</div><button class="btn secondary small" id="disconnectCalBtn" style="margin-top:10px;">Disconnect</button>`;
    } else {
      card.innerHTML = lastCalEvents.map((ev,i)=>{
        const start = (ev.start && (ev.start.dateTime || ev.start.date)) || '';
        return `<div class="joblist-item">
          <div class="jl-left"><div class="cust">${esc(ev.summary)||'(no title)'}</div>
          <div class="meta">${esc(start)} ${ev.location? '· '+esc(ev.location):''}</div></div>
          <button class="btn small safety usejob-btn" data-i="${i}">Use for new job</button>
        </div>`;
      }).join('') + `<button class="btn secondary small" id="disconnectCalBtn" style="margin-top:10px;">Disconnect</button>`;
      card.querySelectorAll('.usejob-btn').forEach(btn=> btn.addEventListener('click', ()=>{
        state.pendingEvent = lastCalEvents[parseInt(btn.dataset.i)];
        setView('newjob');
      }));
    }
  }catch(err){
    console.error('calendar load failed', err);
    card.innerHTML = `<div class="empty">${esc(err.message||'Could not load events.')}</div><button class="btn safety small" id="connectCalBtn" style="margin-top:10px;">Reconnect</button>`;
    document.getElementById('connectCalBtn').addEventListener('click', connectCalendar);
  }
  const dc = document.getElementById('disconnectCalBtn'); if(dc) dc.addEventListener('click', disconnectCalendar);
}

// ---- AI helpers (vision scan + web search for manuals) ----
async function callClaude(messages, tools){
  const body = { model: "claude-sonnet-4-6", max_tokens: 1500, messages };
  if(tools) body.tools = tools;
  const resp = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  return await resp.json();
}
function extractJson(text){
  if(!text) throw new Error('No response text from AI.');
  const clean = text.replace(/```json|```/gi,'').trim();
  const match = clean.match(/\{[\s\S]*\}/);
  if(!match) throw new Error("AI didn't return readable data.");
  try{ return JSON.parse(match[0]); }
  catch(e){ throw new Error("AI response wasn't valid data."); }
}

  ]}]);

async function scanAnalyserPrintout(base64, mediaType){
  const fieldList = COMBUSTION_FIELDS.map(([key])=>key).join(', ');
  const data = await callClaude([{ role:"user", content:[
    { type:"image", source:{ type:"base64", media_type: mediaType, data: base64 } },
    { type:"text", text:
`This is a printout or photo from a flue gas combustion analyser. Read the values and map them to this exact set of JSON keys: ${fieldList}.

Typical mappings (analyser label → key): PRS/draught pressure → draughtPressureMbar (NOT burnerPressureMbar — that's a separate manual gas-pressure reading the analyser doesn't take); T1/flue gas temp → flueGasTempC; T2 or Ta/ambient → roomTempC; NETT/net flue temp → flueGasTempNetC; O2 → o2Pct; CO2 → co2Pct; CO → coPpm (if the printout shows CO as a percentage, convert it to ppm by multiplying by 10000); NOx or NOx(n) → noxPct (this is actually a ppm reading despite the key name); CO/CO2 → coCo2Ratio; XAIR/excess air → excessAirPct; EFFnc or EFFgr/efficiency → grossEfficiencyPct; CO flue dilution → coFlueDilutionPpm. Heat input rate, gas rate, and burner/gas pressure are not shown on an analyser printout — always leave burnerPressureMbar blank and only fill heat input/gas rate if clearly printed.

Reply with ONLY a JSON object using exactly those keys, empty string "" for anything not shown or not legible. No other text.` }
  ]}]);
  const block = (data.content||[]).find(c=>c.type==='text');
  if(!block) throw new Error('no text in response');
  return extractJson(block.text);
}

// ---- Analyser JSON export import (e.g. KANE and similar devices) ----
const ANALYSER_KEY_MAP = {
  'PRS': { key:'draughtPressureMbar' },
  'T1': { key:'flueGasTempC' },
  'Ta': { key:'roomTempC' },
  'T2': { key:'roomTempC' },
  'NETT': { key:'flueGasTempNetC' },
  'O2': { key:'o2Pct' },
  'CO2': { key:'co2Pct' },
  'CO': { key:'coPpm', convertPctToPpm:true },
  'NOx': { key:'noxPct' },
  'NOx(n)': { key:'noxPct' },
  'XAIR': { key:'excessAirPct' },
  'EFFnc': { key:'grossEfficiencyPct' },
  'EFFgr': { key:'grossEfficiencyPct' },
  'CO/CO2': { key:'coCo2Ratio' }
};
function isUsableReading(val){
  if(val===undefined || val===null) return false;
  const s = String(val).trim();
  if(!s) return false;
  if(s.includes('-')) return false;
  if(/[A-Za-z]/.test(s)) return false;
  return true;
}
function parseAnalyserJson(text){
  const data = JSON.parse(text);
  if(!Array.isArray(data)) throw new Error('Expected a list of readings.');
  return data.filter(e => e.report_details && e.report_details.report_type === 'COMBUSTION' && e.report_data && Array.isArray(e.report_data.COMBUSTION));
}
function mapAnalyserReading(entry){
  const out = {};
  entry.report_data.COMBUSTION.forEach(item=>{
    const map = ANALYSER_KEY_MAP[item.key];
    if(!map) return;
    if(!isUsableReading(item.value)) return;
    let val = String(item.value).trim();
    if(map.convertPctToPpm && item.unit === '%'){
      const num = parseFloat(val);
      if(!isNaN(num)) val = String(Math.round(num*10000));
    }
    out[map.key] = val;
  });
  return out;
}
async function findManualOnline(make, model, imageData, serial){
  const serialLine = serial ? ` The unit's serial number is ${serial}.` : '';
  const instructions = `Find the official manufacturer installation, commissioning and maintenance manual for this appliance.${serialLine} Search thoroughly, including the manufacturer's own downloads/manuals page and any other indexed sources.

Reply with ONLY a JSON object with exactly these fields:
{"url":"","documentType":"","manufacturerWebsite":"","manufacturerPhone":"","manufacturerEmail":"","note":""}

- "url": a direct link to the full installation/commissioning/maintenance manual PDF, if you can find one. Leave empty if you only found a data sheet, brochure, or spec sheet rather than a full manual.
- "documentType": what "url" actually is, e.g. "full installation & maintenance manual". Leave empty if url is empty.
- "manufacturerWebsite", "manufacturerPhone", "manufacturerEmail": the manufacturer's own contact details, filled in wherever you can find them — do this even if you couldn't find a full manual, since it's useful on its own.
- "note": ALWAYS fill this in, 2-4 sentences. Say what you actually checked (which pages/sources), what you found even if it's only a data sheet or brochure (name it and give its link), and why a full manual couldn't be confirmed if that's the case. If contacting the manufacturer directly is the practical next step — for example because manuals are issued per-unit or the model is older — say so plainly, mention the serial number if one was given, and note any phone/email you found. Be genuinely useful here: the engineer shouldn't have to repeat searches you've already done.`;
  const content = [];
  if(imageData){
    content.push({ type:"image", source:{ type:"base64", media_type: imageData.mediaType, data: imageData.base64 } });
    content.push({ type:"text", text:
      `This is a photo of a boiler/appliance data badge. Read the exact make, model and any model code straight from the photo yourself — don't just rely on the typed reference below, which may be incomplete or slightly wrong. Typed reference: make="${make}", model="${model}".\n\n${instructions}` });
  } else {
    content.push({ type:"text", text: `Appliance: "${make} ${model}".\n\n${instructions}` });
  }
  const data = await callClaude([{ role:"user", content }], [{ type:"web_search_20250305", name:"web_search" }]);
  const block = (data.content||[]).filter(c=>c.type==='text').pop();
  if(!block) throw new Error('no text in response');
  return extractJson(block.text);
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image decode failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function ramsTemplate(job, appliances, manualRefs){
  appliances = appliances || [];
  manualRefs = manualRefs || {};
  const hazards = HAZARDS_BY_TYPE[job.jobType] || HAZARDS_BY_TYPE['Service'];
  const applianceLines = appliances.length
    ? appliances.map(a=>{
        const ref = manualRefs[a.id];
        const refLine = ref && (ref.chapter || ref.page)
          ? ` — manual reference: ${ref.chapter||'see manual'}${ref.page?', page '+ref.page:''}`
          : '';
        return `- ${a.make} ${a.model} (${a.applianceType}), serial ${a.serial||'not recorded'}${refLine}`;
      }).join('\n')
    : '- appliance not yet linked';
  const applianceNameList = appliances.length ? appliances.map(a=>a.make+' '+a.model).join(', ') : 'the appliance(s)';
  return `RISK ASSESSMENT & METHOD STATEMENT
Job: ${job.jobType} — ${job.customerName}
Site address: ${job.address}
Appliance(s):
${applianceLines}
Date: ${job.date || '(not set)'}

IDENTIFIED HAZARDS
${hazards.map(h=>'- '+h).join('\n')}

CONTROL MEASURES
- Isolate gas supply at the meter/appliance valve before disturbing pipework or components.
- Isolate electrical supply to the appliance before opening electrical connections.
- Ventilate the work area; do not work alone if CO exposure risk is elevated.
- Use appropriate PPE: gloves, eye protection; safety footwear on site.
- Test for gas soundness before leaving each appliance live (tightness test).
- Carry a calibrated CO alarm / analyser and portable CO detector during works.
- Follow safe manual handling technique for appliance movement; use second person for lifts over 20kg.
- Keep escape routes and work area clear of trip hazards.

METHOD STATEMENT (SUMMARY)
1. Arrive on site, introduce yourself, confirm access and isolate utilities as required.
2. Carry out visual inspection of each appliance, flue and ventilation before starting work.
3. Complete the job in line with manufacturer instructions for ${applianceNameList}.
4. On completion, carry out all statutory safety checks (tightness test, flue flow, spillage, ventilation) on each appliance.
5. Record results on the job completion form for each appliance. If an appliance is unsafe, issue warning notice and disconnect where required by regulation.
6. Leave site tidy, brief customer on outcome, and photograph completed work for the job file.

This is a working draft — review and amend for site-specific hazards before use.`;
}

function defaultCombustionReadings(){
  return { heatInputKW:'', burnerPressureMbar:'', gasRateM3hr:'', roomTempC:'', flueGasTempC:'', flueGasTempNetC:'', draughtPressureMbar:'', o2Pct:'', coPpm:'', co2Pct:'', noxPct:'', excessAirPct:'', coCo2Ratio:'', coFlueDilutionPpm:'', grossEfficiencyPct:'' };
}
function defaultCompletion(){
  return {
    engineerName:'', regNumber:'',
    combustion:{ low: defaultCombustionReadings(), high: defaultCombustionReadings() },
    generalChecks:{ compressorOk:'', chimneyStandard:'', tightnessTest:'', pipeworkSupported:'', chimneyTermination:'', fanFlueInterlock:'' },
    ventilation:{ lowerFreeAreaCm2:'', higherFreeAreaCm2:'', naturalSatisfactory:'', mechFlowInlet:'', mechFlowExtract:'', mechSatisfactory:'', calcKw:'', calcUnit:'net', calcFlueType:'' },
    extraChecks:{ adequateVentilation:'', spillageTest:'', flueFlowTest:'', pressureSwitch:'', lockOutTime:'', tempThermostats:'', limitThermostats:'', serviced:'' },
    pipework:{ lineDiagramPresent:'', lineDiagramCurrent:'', isolationValvesFitted:'', valveHandlesLabelled:'', pipeworkSealed:'', pipeworkColourCoded:'', electricallyBonded:'' },
    meter:{ accessible:'', clutterFree:'', ventilated:'', secure:'', keyLabelled:'' },
    safetyInfo:{ coAlarmPresent:'', warningNoticeIssued:'', warningLabelsAttached:'', responsiblePersonAdvised:'' },
    workCarriedOut:'', remedialWork:'',
    overallResult:'', remarks:'', nextInspection:''
  };
}
function normalizeCompletion(c){
  c = c || {};
  const d = defaultCompletion();
  const merged = Object.assign({}, d, c);
  ['generalChecks','ventilation','extraChecks','pipework','meter','safetyInfo'].forEach(k=>{
    merged[k] = Object.assign({}, d[k], c[k]||{});
  });
  if(c.combustion && (c.combustion.low || c.combustion.high)){
    merged.combustion = { low: Object.assign({}, d.combustion.low, c.combustion.low||{}), high: Object.assign({}, d.combustion.high, c.combustion.high||{}) };
  } else if(c.combustion){
    merged.combustion = { low: defaultCombustionReadings(), high: Object.assign({}, d.combustion.high, c.combustion) };
  } else {
    merged.combustion = { low: defaultCombustionReadings(), high: defaultCombustionReadings() };
  }
  if(c.ventilationOk && !merged.extraChecks.adequateVentilation) merged.extraChecks.adequateVentilation = c.ventilationOk;
  if(c.tightnessTest && !merged.generalChecks.tightnessTest) merged.generalChecks.tightnessTest = c.tightnessTest;
  if(c.spillageTest && !merged.extraChecks.spillageTest) merged.extraChecks.spillageTest = c.spillageTest;
  if(c.flueFlowTest && !merged.extraChecks.flueFlowTest) merged.extraChecks.flueFlowTest = c.flueFlowTest;
  if(c.coAlarmPresent && !merged.safetyInfo.coAlarmPresent) merged.safetyInfo.coAlarmPresent = c.coAlarmPresent;
  if(c.warningIssued && !merged.safetyInfo.warningNoticeIssued) merged.safetyInfo.warningNoticeIssued = c.warningIssued;
  return merged;
}
function ensureJobShape(job){
  // migrate single appliance -> multiple appliances
  if(job.applianceId !== undefined){
    if(!Array.isArray(job.applianceIds)) job.applianceIds = job.applianceId ? [job.applianceId] : [];
    delete job.applianceId;
  }
  if(!Array.isArray(job.applianceIds)) job.applianceIds = [];

  // migrate single completion -> one completion per appliance
  if(job.completion){
    const oldKey = job.applianceIds[0] || 'none';
    if(!job.completions) job.completions = {};
    if(!job.completions[oldKey]) job.completions[oldKey] = job.completion;
    delete job.completion;
  }
  if(!job.completions || typeof job.completions !== 'object') job.completions = {};

  const keys = job.applianceIds.length ? job.applianceIds.slice() : ['none'];
  keys.forEach(k=>{ job.completions[k] = normalizeCompletion(job.completions[k]); });

  if(!job.manualRefs || typeof job.manualRefs !== 'object') job.manualRefs = {};

  if(job.recordType !== 'domestic') job.recordType = 'commercial';
  job.domesticCompletion = normalizeDomesticCompletion(job.domesticCompletion, keys);

  ensureInvoiceShape(job);
  return job;
}

  const listEl = document.getElementById('custList');

  listEl.innerHTML = customers.map(c=>{
    const theirAppliances = appliances.filter(a=>a.customerId===c.id);
    const expanded = state.expandedCustomer === c.id;
    return `<div class="customer-card">
      <div class="customer-head" data-id="${c.id}">
        <div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.address)}${c.email? ' · '+esc(c.email):''}</div></div>
        <div class="meta">${theirAppliances.length} appliance${theirAppliances.length===1?'':'s'}</div>
      </div>
      <div class="customer-body ${expanded?'':'hidden'}">
        ${theirAppliances.map(a=>`<div class="appliance-row">
          <div><div class="t">${esc(a.applianceType)} — ${esc(a.make)} ${esc(a.model)}</div>
          <div class="m">Serial: ${esc(a.serial)||'—'} ${a.manual? '· <a href="'+esc(a.manual)+'" target="_blank">manual</a>':'· no manual link yet'}</div></div>
          <button class="btn secondary small" data-editap="${a.id}" data-editcust="${c.id}">Edit</button>
        </div>`).join('') || '<div class="note">No appliances added yet.</div>'}
        <button class="btn secondary small" style="margin-top:12px;" data-addap="${c.id}">+ Add appliance</button>
        <div id="apformSlot_${c.id}"></div>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.customer-head').forEach(h=> h.addEventListener('click', ()=>{
    state.expandedCustomer = state.expandedCustomer===h.dataset.id ? null : h.dataset.id;
    state.addingApplianceFor = null;
    renderCustomers(main);
  }));
  listEl.querySelectorAll('[data-addap]').forEach(b=> b.addEventListener('click', ()=>{
    state.addingApplianceFor = b.dataset.addap;
    badgeImageData = null; manualSearchResult = null; editingAppliance = null;
    document.getElementById('apformSlot_'+b.dataset.addap).innerHTML = applianceFormHTML();
    wireApplianceForm(b.dataset.addap, main);
  }));
  listEl.querySelectorAll('[data-editap]').forEach(b=> b.addEventListener('click', ()=>{
    const appliance = appliances.find(x=>x.id===b.dataset.editap);
    if(!appliance) return;
    state.addingApplianceFor = b.dataset.editcust;
    badgeImageData = null; manualSearchResult = null; editingAppliance = appliance;
    document.getElementById('apformSlot_'+b.dataset.editcust).innerHTML = applianceFormHTML(appliance);
    wireApplianceForm(b.dataset.editcust, main, appliance);
  }));
}

function wireApplianceForm(customerId, main, existingAppliance){
  const typeSel = document.getElementById('ap_type');
  const details = document.getElementById('ap_details');
  typeSel.addEventListener('change', ()=> details.classList.toggle('hidden', !typeSel.value));

  document.getElementById('cancelApplianceBtn').addEventListener('click', ()=>{
    state.addingApplianceFor = null; badgeImageData = null; manualSearchResult = null; editingAppliance = null; renderCustomers(main);
  });

  const photoInput = document.getElementById('badgePhotoInput');
  const scanBtn = document.getElementById('scanBadgeBtn');
  photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files[0]; if(!file) return;
    try{
      const compressed = await compressImage(file, 900, 0.72);
      badgeImageData = compressed;
      document.getElementById('badgePreview').innerHTML = `<img class="badge-thumb" src="${compressed.dataUrl}">`;
      scanBtn.disabled = false;
    }catch(err){ document.getElementById('scanStatus').textContent = 'Could not read that photo — try a different one.'; }
  });
  scanBtn.addEventListener('click', async ()=>{
    if(!badgeImageData) return;
    scanBtn.disabled = true;
    document.getElementById('scanStatus').textContent = 'Scanning photo…';
    try{
      const result = await scanBadgePhoto(badgeImageData.base64, badgeImageData.mediaType);
      if(result.make) document.getElementById('ap_make').value = result.make;
      if(result.model) document.getElementById('ap_model').value = result.model;
      if(result.serial) document.getElementById('ap_serial').value = result.serial;
      document.getElementById('scanStatus').textContent = 'Scanned — check the fields above before saving.';
    }catch(err){
      console.error('scan failed', err);
      document.getElementById('scanStatus').textContent = "Couldn't read that badge automatically — enter the details manually.";
    }
    scanBtn.disabled = false;
  });

  document.getElementById('findManualBtn').addEventListener('click', async ()=>{
    const make = document.getElementById('ap_make').value.trim();
    const model = document.getElementById('ap_model').value.trim();
    const serial = document.getElementById('ap_serial').value.trim();
    if(!make || !model){ document.getElementById('manualStatus').textContent = 'Fill in make and model first.'; return; }
    const btn = document.getElementById('findManualBtn');
    btn.disabled = true;
    document.getElementById('manualStatus').textContent = 'Searching the web…';
    document.getElementById('manualInfoBox').innerHTML = '';
    try{
      const result = await findManualOnline(make, model, badgeImageData, serial);
      manualSearchResult = result;
      if(result.url){
        document.getElementById('ap_manual').value = result.url;
        document.getElementById('manualStatus').textContent = `Found: ${result.documentType || 'a document'} — open it and confirm it's the right one before relying on it.`;
      } else {
        document.getElementById('manualStatus').textContent = "No full manual confirmed — see details below, and check the contact info if you need to request one.";
      }
      const contactLines = [];
      if(result.manufacturerWebsite) contactLines.push(`<a href="${esc(result.manufacturerWebsite)}" target="_blank">${esc(result.manufacturerWebsite)}</a>`);
      if(result.manufacturerPhone) contactLines.push(`<a href="tel:${esc(result.manufacturerPhone.replace(/\s+/g,''))}">${esc(result.manufacturerPhone)}</a>`);
      if(result.manufacturerEmail) contactLines.push(`<a href="mailto:${esc(result.manufacturerEmail)}">${esc(result.manufacturerEmail)}</a>`);
      document.getElementById('manualInfoBox').innerHTML = `
        <div style="border:1px dashed var(--line); border-radius:8px; padding:10px; margin-top:8px;">
          ${result.url ? `<button class="btn secondary small" id="openManualBtn" type="button" style="margin-bottom:8px;">Open manual</button>` : ''}
          ${result.note ? `<div style="font-size:13px;">${esc(result.note)}</div>` : ''}
          ${contactLines.length ? `<div class="note" style="margin-top:6px;"><strong>Manufacturer contact:</strong> ${contactLines.join(' · ')}</div>` : ''}
        </div>`;
      const openBtn = document.getElementById('openManualBtn');
      if(openBtn) openBtn.addEventListener('click', ()=> window.open(result.url, '_blank'));
    }catch(err){
      console.error('manual search failed', err);
      document.getElementById('manualStatus').textContent = "Search failed — add the link manually.";
    }
    btn.disabled = false;
  });

  document.getElementById('saveApplianceBtn').addEventListener('click', async ()=>{
    const applianceType = document.getElementById('ap_type').value;
    const make = document.getElementById('ap_make').value.trim();
    const model = document.getElementById('ap_model').value.trim();
    if(!applianceType || !make || !model){ alert('Appliance type, make and model are required.'); return; }
    let manualNote = existingAppliance ? (existingAppliance.manualNote || '') : '';
    if(manualSearchResult){
      const parts = [];
      if(manualSearchResult.note) parts.push(manualSearchResult.note);
      const contact = [];
      if(manualSearchResult.manufacturerWebsite) contact.push(manualSearchResult.manufacturerWebsite);
      if(manualSearchResult.manufacturerPhone) contact.push(manualSearchResult.manufacturerPhone);
      if(manualSearchResult.manufacturerEmail) contact.push(manualSearchResult.manufacturerEmail);
      if(contact.length) parts.push('Manufacturer contact: ' + contact.join(' · '));
      manualNote = parts.join('\n');
    }
    const a = {
      id: existingAppliance ? existingAppliance.id : uid('ap'), customerId, applianceType, make, model,
      serial: document.getElementById('ap_serial').value.trim(),
      location: document.getElementById('ap_location').value.trim(),
      notes: document.getElementById('ap_notes').value.trim(),
      manual: document.getElementById('ap_manual').value.trim(),
      manualNote,
      photoThumb: badgeImageData ? badgeImageData.dataUrl : (existingAppliance ? existingAppliance.photoThumb||'' : '')
    };
    const saved = await saveAppliance(a);
    if(saved){ state.addingApplianceFor = null; badgeImageData = null; manualSearchResult = null; editingAppliance = null; renderCustomers(main); }
  });
}

// ---- New job / job detail ----
async function renderNewJob(main){
  const customers = await loadAll('customer:');
  const selectedId = state.newJobCustomerId;
  const appliances = selectedId ? (await loadAll('appliance:')).filter(a=>a.customerId===selectedId) : [];
  const selectedCustomer = customers.find(c=>c.id===selectedId);
  const ev = state.pendingEvent; state.pendingEvent = null;
  let prefillDate='', prefillTime='', prefillNotes='';
  if(ev){
    const dt = ev.start && (ev.start.dateTime || ev.start.date);
    if(dt){ const d = new Date(dt); if(!isNaN(d)){ prefillDate = d.toISOString().slice(0,10); if(ev.start.dateTime) prefillTime = d.toTimeString().slice(0,5); } }
    prefillNotes = `From calendar: ${ev.summary||'(no title)'}${ev.location? ' @ '+ev.location:''}`;
  }
  main.innerHTML = `
    <div class="pagehead"><h1>New job</h1></div>
    ${ev ? `<div class="card note">Pre-filled from your calendar — pick which customer this booking is for below.</div>` : ''}
    <div class="card">
      ${!customers.length ? `<div class="empty">No customers yet. Add one on the Customers tab first, then come back here.</div>` : `
      <div class="field"><label>Customer</label>
        <select id="j_customer">
          <option value="">— choose customer —</option>
          ${customers.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      ${selectedCustomer ? `<div class="note">${esc(selectedCustomer.address)} ${selectedCustomer.phone? '· '+esc(selectedCustomer.phone):''}</div><div class="divider"></div>` : ''}
      <div class="grid3">
        <div class="field"><label>Date</label><input type="date" id="j_date" value="${esc(prefillDate)}"></div>
        <div class="field"><label>Time</label><input type="time" id="j_time" value="${esc(prefillTime)}"></div>
        <div class="field"><label>Job type</label><select id="j_type">${JOB_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Completion form</label>
        <select id="j_recordtype">
          <option value="commercial" selected>Commercial (full non-domestic form)</option>
          <option value="domestic">Domestic (Gas Safety Record / CP1 style)</option>
        </select>
      </div>
      <div class="field"><label>Estimated duration</label>
        <select id="j_duration">
          <option value="30">30 minutes</option>
          <option value="60" selected>1 hour</option>
          <option value="90">1.5 hours</option>
          <option value="120">2 hours</option>
          <option value="180">3 hours</option>
          <option value="240">4 hours</option>
          <option value="480">Full day</option>
        </select>
      </div>
      <div class="field"><label>Appliance(s)</label>
        ${!selectedId ? `<div class="note">Choose a customer first.</div>` : appliances.length ? `
        <div class="apform">
          ${appliances.map(a=>`<label style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px; font-weight:400; color:var(--ink);">
            <input type="checkbox" class="j-appliance-cb" value="${a.id}" style="width:auto;"> ${esc(a.applianceType)} — ${esc(a.make)} ${esc(a.model)}
          </label>`).join('')}
        </div>` : '<div class="note">This customer has no appliances on file yet — add one from the Customers tab.</div>'}
      </div>
      <div class="field"><label>Notes</label><textarea id="j_notes" rows="2">${esc(prefillNotes)}</textarea></div>
      <button class="btn safety" id="createJobBtn">Create job folder</button>
      `}
    </div>
  `;
  if(!customers.length) return;
  document.getElementById('j_customer').addEventListener('change', (e)=>{ state.newJobCustomerId = e.target.value; renderNewJob(main); });
  document.getElementById('createJobBtn').addEventListener('click', async ()=>{
    const customerId = document.getElementById('j_customer').value;
    const customer = customers.find(c=>c.id===customerId);
    if(!customer){ alert('Choose a customer first.'); return; }
    const job = newBlankJob();
    job.customerId = customer.id; job.customerName = customer.name; job.phone = customer.phone; job.address = customer.address;
    job.date = document.getElementById('j_date').value;
    job.time = document.getElementById('j_time').value;
    job.durationMinutes = parseInt(document.getElementById('j_duration').value) || 60;
    job.jobType = document.getElementById('j_type').value;
    job.recordType = document.getElementById('j_recordtype').value;
    job.applianceIds = Array.from(main.querySelectorAll('.j-appliance-cb:checked')).map(cb=>cb.value);
    job.notes = document.getElementById('j_notes').value.trim();
    const linkedAppliances = appliances.filter(a=>job.applianceIds.includes(a.id));
    job.completions = {};
    (job.applianceIds.length ? job.applianceIds : ['none']).forEach(k=> job.completions[k] = defaultCompletion());
    job.ramsText = ramsTemplate(job, linkedAppliances);
    await saveJob(job);
    state.newJobCustomerId = '';
    setView('job', job.id);
  });
}

async function renderJobDetail(main){
  let job = jobCache[state.jobId];
  if(!job){
    const r = await dbGet('job:'+state.jobId).catch(()=>null);
    if(!r){ main.innerHTML = `<div class="empty">Job not found. <button class="btn secondary small" id="backToJobs">Back to jobs</button></div>`;
      const bb = document.getElementById('backToJobs'); if(bb) bb.addEventListener('click', ()=> setView('jobs')); return; }
    job = JSON.parse(r.value); jobCache[job.id] = job;
  }
  ensureJobShape(job);
  const allAppliances = await loadAll('appliance:');
  const jobAppliances = allAppliances.filter(a=>job.applianceIds.includes(a.id));
  const customers = await loadAll('customer:');
  const customer = customers.find(cu=>cu.id===job.customerId);

  const completionKeys = job.applianceIds.length ? job.applianceIds : ['none'];
  if(!state.completionApplianceKey || !completionKeys.includes(state.completionApplianceKey)){
    state.completionApplianceKey = completionKeys[0];
  }
  const currentAppliance = jobAppliances.find(a=>a.id===state.completionApplianceKey) || null; // reserved for future per-appliance UI needs

  main.innerHTML = `
    <button class="back" id="backBtn">← All jobs</button>
    <div class="pagehead">
      <div><h1>${esc(job.customerName)||'Job'}</h1><div class="note">${esc(job.jobType)} · ${esc(job.address)}</div></div>
      <select id="statusSel" style="width:auto;">${['Scheduled','In Progress','Complete'].map(s=>`<option ${s===job.status?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="tabs">
      <button data-t="overview" class="${state.jobTab==='overview'?'active':''}">Overview</button>
      <button data-t="rams" class="${state.jobTab==='rams'?'active':''}">RAMS</button>
      <button data-t="completion" class="${state.jobTab==='completion'?'active':''}">Completion form</button>
      <button data-t="invoice" class="${state.jobTab==='invoice'?'active':''}">Invoice draft</button>
    </div>
    <div id="tabBody"></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=> setView('jobs'));
  document.getElementById('statusSel').addEventListener('change', async (e)=>{ job.status = e.target.value; await saveJob(job); });
  main.querySelectorAll('.tabs button').forEach(b=> b.addEventListener('click', ()=>{ state.jobTab=b.dataset.t; state.editingJob=false; renderJobDetail(main); }));

  const body = document.getElementById('tabBody');
  if(state.jobTab==='overview') {
    if(state.editingJob){
      const customerAppliances = allAppliances.filter(a=>a.customerId===job.customerId);
      body.innerHTML = editJobHTML(job, customerAppliances);
      wireEditJob(job, main);
    } else {
      body.innerHTML = overviewHTML(job, jobAppliances);
      wireOverview(job, main);
    }
  }
  if(state.jobTab==='rams') { body.innerHTML = ramsHTML(job); wireRams(job); }
  if(state.jobTab==='completion') {
    for(const key of completionKeys){
      const appliance = jobAppliances.find(a=>a.id===key);
      if(!appliance) continue;
      if(job.recordType === 'domestic'){
        const row = job.domesticCompletion.applianceRows[key];
        if(row && !row.ventCalc.kw && !row.ventCalc.lowerFreeAreaCm2 && !row.ventCalc.higherFreeAreaCm2){
          const prev = await findPreviousVentilationData(key, job.id);
          if(prev) row.ventCalc = Object.assign({}, row.ventCalc, prev);
        }
      } else {
        const c = job.completions[key];
        if(c && !c.ventilation.calcKw && !c.ventilation.lowerFreeAreaCm2 && !c.ventilation.higherFreeAreaCm2){
          const prev = await findPreviousVentilationData(key, job.id);
          if(prev) c.ventilation = Object.assign({}, c.ventilation, { calcKw: prev.kw, calcUnit: prev.unit, calcFlueType: prev.flueType, lowerFreeAreaCm2: prev.lowerFreeAreaCm2, higherFreeAreaCm2: prev.higherFreeAreaCm2 });
        }
      }
    }
    if(job.recordType === 'domestic'){
      body.innerHTML = domesticCompletionHTML(job, jobAppliances, completionKeys);
      wireDomesticCompletion(job, jobAppliances, completionKeys);
    } else {
      let html = '';
      if(completionKeys.length > 1){
        html += `<div class="tabs" style="margin-bottom:14px;">${completionKeys.map(k=>{
          const a = jobAppliances.find(x=>x.id===k);
          const label = a ? `${esc(a.applianceType)} — ${esc(a.make)} ${esc(a.model)}` : 'General';
          return `<button data-akey="${k}" class="${k===state.completionApplianceKey?'active':''}">${label}</button>`;
        }).join('')}</div>`;
      }
      html += completionHTML(job, state.completionApplianceKey);
      body.innerHTML = html;
      body.querySelectorAll('[data-akey]').forEach(b=> b.addEventListener('click', ()=>{ state.completionApplianceKey = b.dataset.akey; renderJobDetail(main); }));
      wireCompletion(job, jobAppliances, state.completionApplianceKey);
    }
  }
  if(state.jobTab==='invoice') { body.innerHTML = invoiceHTML(job, jobAppliances, customer, completionKeys); wireInvoice(job, jobAppliances, customer); }
}

async function addJobToCalendar(job){
  if(!gcalToken){ alert('Connect Google Calendar from the Calendar tab first.'); return; }
  if(!job.date){ alert('Add a date to this job first (Overview tab has no date field yet — set it when creating the job).'); return; }
  await loadGapiClient();
  gapi.client.setToken({ access_token: gcalToken });
  const start = new Date(`${job.date}T${job.time || '09:00'}:00`);
  const end = new Date(start.getTime() + (job.durationMinutes || 60)*60*1000);
  try{
    const resp = await gapi.client.calendar.events.insert({
      calendarId: 'primary',
      resource: {
        summary: `${job.jobType} — ${job.customerName}`,
        location: job.address,
        description: job.notes || '',
        start: { dateTime: start.toISOString() },
        end: { dateTime: end.toISOString() }
      }
    });
    job.calendarEventId = resp.result.id;
    await saveJob(job);
    renderJobDetail(document.getElementById('main'));
  }catch(err){
    console.error('add to calendar failed', err);
    alert("Couldn't add this to your calendar — check you're connected and try again.");
  }
}
function formatDuration(mins){
  mins = mins || 60;
  if(mins >= 480) return 'Full day';
  if(mins % 60 === 0) return (mins/60) + ' hour' + (mins===60?'':'s');
  if(mins < 60) return mins + ' minutes';
  return (mins/60).toFixed(1).replace('.0','') + ' hours';
}

    // keep completion data for appliances still linked, add blank ones for newly added appliances, fall back to "none" if all removed
    const keys = newIds.length ? newIds : ['none'];
    const newCompletions = {};
    keys.forEach(k=> newCompletions[k] = job.completions[k] || defaultCompletion());

    if(state.completionApplianceKey && !keys.includes(state.completionApplianceKey)) state.completionApplianceKey = null;

    renderJobDetail(main);

function wireRams(job){
  document.getElementById('saveRamsBtn').addEventListener('click', async ()=>{ job.ramsText = document.getElementById('ramsBox').value; await saveJob(job); });
  document.getElementById('regenRamsBtn').addEventListener('click', async ()=>{
    const allAppliances = await loadAll('appliance:');
    const jobAppliances = allAppliances.filter(a=>job.applianceIds.includes(a.id));
    job.ramsText = ramsTemplate(job, jobAppliances, job.manualRefs); await saveJob(job); renderJobDetail(document.getElementById('main'));
  });
  document.getElementById('lookupManualRefsBtn').addEventListener('click', async ()=>{
    const allAppliances = await loadAll('appliance:');
    const jobAppliances = allAppliances.filter(a=>job.applianceIds.includes(a.id));
    const withManuals = jobAppliances.filter(a=>a.manual);
    const statusEl = document.getElementById('manualRefsStatus');
    if(!withManuals.length){ statusEl.textContent = 'None of the linked appliances have a manual link saved yet — add one from the Customers tab first.'; return; }
    statusEl.textContent = `Looking up ${withManuals.length} manual${withManuals.length>1?'s':''}...`;
    for(const a of withManuals){
      try{
        const ref = await findManualSection(a.make, a.model, a.manual, job.jobType);
        job.manualRefs[a.id] = ref;
      }catch(e){
        job.manualRefs[a.id] = { chapter:'', page:'', note:'Lookup failed — try again or check the manual manually.' };
      }
    }
    job.ramsText = ramsTemplate(job, jobAppliances, job.manualRefs);
    await saveJob(job);
    renderJobDetail(document.getElementById('main'));
  });
}

async function findPreviousVentilationData(applianceId, excludeJobId){
  if(!applianceId) return null;
  const allJobs = await loadAll('job:');
  const candidates = allJobs.filter(j=> j && j.id !== excludeJobId && Array.isArray(j.applianceIds) && j.applianceIds.includes(applianceId));
  candidates.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  for(const j of candidates){
    if(j.completions && j.completions[applianceId] && j.completions[applianceId].ventilation){
      const v = j.completions[applianceId].ventilation;
      if(v.calcKw || v.lowerFreeAreaCm2 || v.higherFreeAreaCm2){
        return { kw: v.calcKw||'', unit: v.calcUnit||'net', flueType: v.calcFlueType||'', lowerFreeAreaCm2: v.lowerFreeAreaCm2||'', higherFreeAreaCm2: v.higherFreeAreaCm2||'' };
      }
    }
    if(j.domesticCompletion && j.domesticCompletion.applianceRows && j.domesticCompletion.applianceRows[applianceId]){
      const vc = j.domesticCompletion.applianceRows[applianceId].ventCalc;
      if(vc && (vc.kw || vc.lowerFreeAreaCm2 || vc.higherFreeAreaCm2)){
        return { kw: vc.kw||'', unit: vc.unit||'net', flueType: vc.flueType||'', lowerFreeAreaCm2: vc.lowerFreeAreaCm2||'', higherFreeAreaCm2: vc.higherFreeAreaCm2||'' };
      }
    }
  }
  return null;
}
function calcVentilation(kw, unit, flueType){
  const netKw = unit === 'gross' ? kw / 1.1 : kw;
  if(flueType === 'room-sealed'){
    return { area: 0, determinable:true, note: `Room-sealed (balanced flue) appliances draw combustion air from outside via the flue and don't normally need additional room ventilation. If this one's in a cupboard or compartment, check the manufacturer's instructions for any cooling-air requirement — that's a separate figure.` };
  }
  if(flueType === 'open-direct' || flueType === 'open-fanned'){
    const fannedNote = flueType === 'open-fanned' ? ` Fan-assisted open flues without a draught diverter still draw their combustion air from the room, so they use the same room ventilation formula as natural-draught open flues — the fan changes the flue design, not this figure.` : '';
    if(netKw <= 7){
      return { area: 0, determinable:true, note: `${netKw.toFixed(2)}kW net is at or below the 7kW threshold — BS 5440-2 treats background (adventitious) ventilation as sufficient, so no additional permanent vent is normally required.${fannedNote} Always confirm against the manufacturer's instructions.` };
    }
    const area = (netKw - 7) * 5;
    return { area, determinable:true, note: `BS 5440-2, ventilating direct to outside air: (${netKw.toFixed(2)}kW net − 7kW) × 5cm²/kW = ${area.toFixed(1)}cm².${fannedNote} This is a single combined opening — whether it sits at low or high level depends on the appliance and installation, so check the manufacturer's instructions before deciding which field to put it in below.` };
  }
  if(flueType === 'open-compartment'){
    return { area: null, determinable:false, note: `Ventilating an open-flued appliance through a cupboard or compartment uses a different low/high-level split in BS 5440-2, and depends on the ventilation route — this calculator doesn't cover that case reliably. Work it out from BS 5440-2 directly or the manufacturer's instructions.` };
  }
  return { area: null, determinable:false, note: `Flueless appliances are sized against room volume (W/m³), not a flat cm²/kW figure — see BS 5440-2 Table 6 or the manufacturer's instructions.` };
}
function updateVentCalc(){
  const kwEl = document.getElementById('vc_kw');
  const unitEl = document.getElementById('vc_unit');
  const flueEl = document.getElementById('vc_flue');
  const resultEl = document.getElementById('ventCalcResult');
  if(!kwEl || !resultEl) return;
  const kw = parseFloat(kwEl.value);
  const unit = unitEl.value;
  const flueType = flueEl.value;
  if(!flueType){ resultEl.innerHTML = `Fill in heat input and flue type for a recommended figure to compare against.`; return; }
  if(isNaN(kw) || kw <= 0){ resultEl.innerHTML = `Enter the max heat input in kW.`; return; }
  const r = calcVentilation(kw, unit, flueType);
  const lower = parseFloat(document.getElementById('v_lower').value) || 0;
  const higher = parseFloat(document.getElementById('v_higher').value) || 0;
  const installed = lower + higher;
  let compareLine = '';
  if(r.determinable && r.area !== null){
    if(installed === 0){
      compareLine = `<div style="margin-top:6px;">Nothing entered yet in the Lower/Higher fields below to compare against.</div>`;
    } else if(installed + 0.05 >= r.area){
      compareLine = `<div style="margin-top:6px; color:#2E7D32; font-weight:600;">✓ ${installed.toFixed(1)}cm² entered meets or exceeds the ${r.area.toFixed(1)}cm² recommended.</div>`;
    } else {
      compareLine = `<div style="margin-top:6px; color:var(--safety); font-weight:600;">⚠ ${installed.toFixed(1)}cm² entered is ${(r.area-installed).toFixed(1)}cm² short of the ${r.area.toFixed(1)}cm² recommended.</div>`;
    }
  }
  resultEl.innerHTML = `
    ${r.determinable && r.area !== null ? `<div style="font-size:18px; font-weight:700; color:var(--ink);">Recommended: ${r.area.toFixed(1)} cm²</div>` : ''}
    <div style="margin-top:4px;">${esc(r.note)}</div>
    ${compareLine}
  `;
}

      analyserImageData = compressed;
      document.getElementById('analyserPreview').innerHTML = `<img class="badge-thumb" src="${compressed.dataUrl}">`;
      scanAnalyserBtn.disabled = false;
    }catch(err){ document.getElementById('analyserStatus').textContent = 'Could not read that photo — try a different one.'; }
  });
  scanAnalyserBtn.addEventListener('click', async ()=>{
    if(!analyserImageData) return;
    scanAnalyserBtn.disabled = true;
    document.getElementById('analyserStatus').textContent = 'Reading the printout…';
    try{
      const result = await scanAnalyserPrintout(analyserImageData.base64, analyserImageData.mediaType);
      const prefix = document.getElementById('analyserTarget').value === 'high' ? 'cbh_' : 'cbl_';
      let filled = 0;
      COMBUSTION_FIELDS.forEach(([key])=>{
        if(key==='burnerPressureMbar') return; // gas pressure is a separate manual reading, never auto-filled
        if(result[key]){ document.getElementById(prefix+key).value = result[key]; filled++; }
      });
      document.getElementById('analyserStatus').textContent = filled
        ? `Filled in ${filled} field${filled===1?'':'s'} — check them against the printout, then Save.`
        : "Couldn't make out any readings from that photo — try a clearer shot or enter them manually.";
    }catch(err){
      console.error('analyser scan failed', err);
      document.getElementById('analyserStatus').textContent = "Couldn't read that printout automatically — enter the readings manually.";
    }
    scanAnalyserBtn.disabled = false;
  });

  let analyserReadings = [];
  function applyReadingToForm(entry, target){
    const mapped = mapAnalyserReading(entry);
    const prefix = target==='high' ? 'cbh_' : 'cbl_';
    let filled = 0;
    COMBUSTION_FIELDS.forEach(([key])=>{ if(key==='burnerPressureMbar') return; if(mapped[key]){ document.getElementById(prefix+key).value = mapped[key]; filled++; } });
    document.getElementById('analyserJsonStatus').textContent =
      `Filled in ${filled} field${filled===1?'':'s'} from ${entry.report_details.date} ${entry.report_details.time} into ${target==='high'?'High':'Low'} fire — check them, then Save.`;
  }
  function renderAnalyserJsonList(){
    const listEl = document.getElementById('analyserJsonList');
    if(!analyserReadings.length){ listEl.innerHTML = ''; return; }
    const withIdx = analyserReadings.map((e,i)=>({e,i}));
    withIdx.sort((a,b)=> ((b.e.report_details.date||'')+(b.e.report_details.time||'')).localeCompare((a.e.report_details.date||'')+(a.e.report_details.time||'')));
    listEl.innerHTML = withIdx.slice(0,30).map(({e,i})=>`
      <div class="joblist-item" style="cursor:default;">
        <div class="jl-left"><div class="cust">${esc(e.report_details.date)} ${esc(e.report_details.time)}</div></div>
        <div style="display:flex; gap:6px;">
          <button class="btn secondary small use-low-btn" data-idx="${i}">→ Low</button>
          <button class="btn secondary small use-high-btn" data-idx="${i}">→ High</button>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('.use-low-btn').forEach(b=> b.addEventListener('click', ()=> applyReadingToForm(analyserReadings[parseInt(b.dataset.idx)], 'low')));
    listEl.querySelectorAll('.use-high-btn').forEach(b=> b.addEventListener('click', ()=> applyReadingToForm(analyserReadings[parseInt(b.dataset.idx)], 'high')));
  }
  document.getElementById('analyserJsonInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        analyserReadings = parseAnalyserJson(reader.result);
        if(!analyserReadings.length){ document.getElementById('analyserJsonStatus').textContent = "That file loaded but didn't contain any combustion readings."; return; }
        document.getElementById('analyserJsonStatus').textContent = `Loaded ${analyserReadings.length} reading${analyserReadings.length===1?'':'s'} — pick the one(s) for this job below (most recent first).`;
        renderAnalyserJsonList();
      }catch(err){
        console.error('analyser json parse failed', err);
        document.getElementById('analyserJsonStatus').textContent = "That file didn't look like a valid analyser export.";
      }
    };
    reader.readAsText(file);
  });
}

function updateVentCalcRow(key){
  const kwEl = document.getElementById('dvc_kw_'+key);
  const unitEl = document.getElementById('dvc_unit_'+key);
  const flueEl = document.getElementById('dvc_flue_'+key);
  const resultEl = document.getElementById('dventCalcResult_'+key);
  if(!kwEl || !resultEl) return;
  const kw = parseFloat(kwEl.value);
  const unit = unitEl.value;
  const flueType = flueEl.value;
  if(!flueType){ resultEl.innerHTML = `Fill in heat input and flue type for a recommended figure to compare against.`; return; }
  if(isNaN(kw) || kw <= 0){ resultEl.innerHTML = `Enter the max heat input in kW.`; return; }
  const r = calcVentilation(kw, unit, flueType);
  const lower = parseFloat(document.getElementById('dv_lower_'+key).value) || 0;
  const higher = parseFloat(document.getElementById('dv_higher_'+key).value) || 0;
  const installed = lower + higher;
  let compareLine = '';
  if(r.determinable && r.area !== null){
    if(installed === 0){
      compareLine = `<div style="margin-top:6px;">Nothing entered yet in the free area fields above to compare against.</div>`;
    } else if(installed + 0.05 >= r.area){
      compareLine = `<div style="margin-top:6px; color:#2E7D32; font-weight:600;">✓ ${installed.toFixed(1)}cm² entered meets or exceeds the ${r.area.toFixed(1)}cm² recommended.</div>`;
    } else {
      compareLine = `<div style="margin-top:6px; color:var(--safety); font-weight:600;">⚠ ${installed.toFixed(1)}cm² entered is ${(r.area-installed).toFixed(1)}cm² short of the ${r.area.toFixed(1)}cm² recommended.</div>`;
    }
  }
  resultEl.innerHTML = `
    ${r.determinable && r.area !== null ? `<div style="font-size:16px; font-weight:700; color:var(--ink);">Recommended: ${r.area.toFixed(1)} cm²</div>` : ''}
    <div style="margin-top:4px;">${esc(r.note)}</div>
    ${compareLine}
  `;
}
function wireDomesticCompletion(job, jobAppliances, completionKeys){
  const main = document.getElementById('main');
  const doSave = async ()=>{
    job.domesticCompletion = readDomesticCompletionFromForm(completionKeys);
    if(job.status==='Scheduled') job.status='In Progress';
    await saveJob(job);
  };
  document.getElementById('saveDomesticBtn').addEventListener('click', async ()=>{ await doSave(); renderJobDetail(main); });
  document.getElementById('printDomesticBtn').addEventListener('click', async ()=>{ await doSave(); openPrintableDomesticRecord(job, jobAppliances); });
  document.getElementById('dc_editBizBtn').addEventListener('click', ()=> showBusinessOverlay());
  const engSelect = document.getElementById('dc_eng_select');
  if(engSelect) engSelect.addEventListener('change', ()=>{
    const chosen = getEngineers().find(e=>e.id===engSelect.value);
    if(chosen){
      document.getElementById('dc_issuedname').value = chosen.name;
      document.getElementById('dc_issuedlicence').value = chosen.regNumber;
    }
  });
  const manageBtn = document.getElementById('dc_manageEngineersBtn');
  if(manageBtn) manageBtn.addEventListener('click', ()=> showEngineersOverlay(async ()=>{
    await doSave();
    renderJobDetail(main);
  }));
  completionKeys.forEach(key=>{
    ['dvc_kw_'+key,'dvc_unit_'+key,'dvc_flue_'+key,'dv_lower_'+key,'dv_higher_'+key].forEach(id=>{
      const el = document.getElementById(id);
      if(el){ el.addEventListener('input', ()=>updateVentCalcRow(key)); el.addEventListener('change', ()=>updateVentCalcRow(key)); }
    });
    updateVentCalcRow(key);
  });
}

function calcInvoiceTotals(inv){
  const subtotal = inv.lineItems.reduce((s,i)=> s + (parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0), 0);
  const vat = inv.vatEnabled ? subtotal * ((parseFloat(inv.vatRate)||0)/100) : 0;
  return { subtotal, vat, total: subtotal+vat };
}
