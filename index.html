    <div class="divider"></div>
    <div class="grid2"><div><label>Bill to</label><div>${esc(job.customerName)}<br>${esc(job.address)}${customer && customer.email ? '<br>'+esc(customer.email):''}</div></div>
    <div><label>Job</label><div>${esc(job.jobType)}${jobAppliances.length? ' — '+jobAppliances.map(a=>a.make+' '+a.model).join(', '):''}</div></div></div>
  </div>

  <div class="card">
    <label>Line items</label>
    ${locked ? `<p class="note">Approved — line items are locked. Click "Edit again (un-approve)" below to make changes.</p>` : ''}
    <div id="lineItemsBody">
      ${inv.lineItems.map(item=>`
      <div class="grid3" style="align-items:end; margin-bottom:8px;" data-row="${item.id}">
        <div class="field" style="margin-bottom:0;"><label>Description</label><input id="li_desc_${item.id}" value="${esc(item.description)}" placeholder="${esc(job.jobType)} — labour" ${locked?'disabled':''}></div>
        <div class="field" style="margin-bottom:0;"><label>Qty</label><input id="li_qty_${item.id}" value="${esc(item.qty)}" inputmode="decimal" ${locked?'disabled':''}></div>
        <div class="field" style="margin-bottom:0; display:flex; gap:6px; align-items:flex-end;">
          <div style="flex:1;"><label>Unit price (£)</label><input id="li_price_${item.id}" value="${esc(item.unitPrice)}" inputmode="decimal" ${locked?'disabled':''}></div>
          <button class="btn secondary small remove-li-btn" data-id="${item.id}" ${inv.lineItems.length<=1||locked?'disabled':''}>✕</button>
        </div>
      </div>`).join('')}
    </div>
    <button class="btn secondary small" id="addLineItemBtn" ${locked?'disabled':''}>+ Add line item</button>
    <div class="divider"></div>
    <div class="grid2">
      <div class="field"><label><input type="checkbox" id="vatEnabled" ${inv.vatEnabled?'checked':''} ${locked?'disabled':''} style="width:auto; margin-right:6px;">Add VAT</label></div>
      <div class="field" id="vatRateField" style="${inv.vatEnabled?'':'display:none;'}"><label>VAT rate (%)</label><input id="vatRate" value="${esc(inv.vatRate)}" inputmode="decimal" ${locked?'disabled':''}></div>
    </div>
    <div class="field"><label>Notes / payment terms</label><textarea id="invNotes" rows="2" ${locked?'disabled':''}>${esc(inv.notes)}</textarea></div>
    <div id="invoiceTotals" class="note" style="font-size:14px; color:var(--ink);"></div>
  </div>

  <div class="card">
    ${inv.status==='approved'
      ? `<div class="note" style="color:var(--ok); font-weight:700;">✓ Approved — ready to send</div>
         <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
           <button class="btn secondary small" id="unapproveBtn">Edit again (un-approve)</button>
           <button class="btn secondary small" id="previewInvoiceBtn">Preview / print invoice</button>
           ${customer && customer.email ? `<button class="btn safety small" id="emailInvoiceBtn">Email to customer</button>` : `<span class="note">Add this customer's email to enable "Email to customer".</span>`}
         </div>`
      : `<p class="note"><strong>This is a draft.</strong> Nothing gets sent until you approve it — approving just marks it reviewed and ready; sending is still a separate, deliberate step.</p>
         <div style="display:flex; gap:8px; flex-wrap:wrap;">
           <button class="btn secondary small" id="saveInvoiceBtn">Save draft</button>
           <button class="btn safety small" id="approveInvoiceBtn">Approve for sending</button>
           <button class="btn secondary small" id="previewInvoiceBtn">Preview / print invoice</button>
         </div>`
    }
  </div>`;
}
function readInvoiceFromForm(job){
  const items = job.invoice.lineItems.map(item=>({
    id: item.id,
    description: document.getElementById('li_desc_'+item.id).value.trim(),
    qty: document.getElementById('li_qty_'+item.id).value,
    unitPrice: document.getElementById('li_price_'+item.id).value
  }));
  return {
    lineItems: items,
    vatEnabled: document.getElementById('vatEnabled').checked,
    vatRate: document.getElementById('vatRate') ? document.getElementById('vatRate').value : job.invoice.vatRate,
    notes: document.getElementById('invNotes').value,
    status: job.invoice.status
  };
}
function wireInvoice(job, jobAppliances, customer){
  const main = document.getElementById('main');
  const completionKeys = job.applianceIds.length ? job.applianceIds : ['none'];
  const ready = job.recordType === 'domestic'
    ? completionKeys.every(k=> job.domesticCompletion.applianceRows[k] && job.domesticCompletion.applianceRows[k].safeToUse)
    : completionKeys.every(k=> job.completions[k] && job.completions[k].overallResult);
  if(!ready) return;

  function recalcTotalsDisplay(){
    const draft = readInvoiceFromForm(job);
    const t = calcInvoiceTotals(draft);
    document.getElementById('invoiceTotals').innerHTML =
      `Subtotal: ${money(t.subtotal)}${draft.vatEnabled ? `<br>VAT (${esc(draft.vatRate)||0}%): ${money(t.vat)}` : ''}<br><strong>Total: ${money(t.total)}</strong>`;
  }
  job.invoice.lineItems.forEach(item=>{
    ['li_desc_','li_qty_','li_price_'].forEach(p=>{
      const el = document.getElementById(p+item.id);
      if(el) el.addEventListener('input', recalcTotalsDisplay);
    });
  });
  document.getElementById('vatEnabled').addEventListener('change', (e)=>{
    document.getElementById('vatRateField').style.display = e.target.checked ? '' : 'none';
    recalcTotalsDisplay();
  });
  const vatRateInput = document.getElementById('vatRate');
  if(vatRateInput) vatRateInput.addEventListener('input', recalcTotalsDisplay);
  recalcTotalsDisplay();

  document.getElementById('addLineItemBtn').addEventListener('click', ()=>{
    job.invoice = readInvoiceFromForm(job);
    job.invoice.lineItems.push({ id: uid('li'), description:'', qty:1, unitPrice:'' });
    renderJobDetail(main);
  });
  main.querySelectorAll('.remove-li-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    job.invoice = readInvoiceFromForm(job);
    job.invoice.lineItems = job.invoice.lineItems.filter(i=>i.id!==btn.dataset.id);
    if(!job.invoice.lineItems.length) job.invoice.lineItems.push({ id: uid('li'), description:'', qty:1, unitPrice:'' });
    renderJobDetail(main);
  }));

  const saveBtn = document.getElementById('saveInvoiceBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    job.invoice = readInvoiceFromForm(job); job.invoice.status = 'draft';
    await saveJob(job); renderJobDetail(main);
  });
  const approveBtn = document.getElementById('approveInvoiceBtn');
  if(approveBtn) approveBtn.addEventListener('click', async ()=>{
    job.invoice = readInvoiceFromForm(job); job.invoice.status = 'approved';
    await saveJob(job); renderJobDetail(main);
  });
  const unapproveBtn = document.getElementById('unapproveBtn');
  if(unapproveBtn) unapproveBtn.addEventListener('click', async ()=>{
    job.invoice.status = 'draft'; await saveJob(job); renderJobDetail(main);
  });
  const previewBtn = document.getElementById('previewInvoiceBtn');
  if(previewBtn) previewBtn.addEventListener('click', ()=>{
    if(job.invoice.status==='draft') job.invoice = Object.assign(readInvoiceFromForm(job), { status:'draft' });
    openPrintableInvoice(job, jobAppliances, customer);
  });
  const emailBtn = document.getElementById('emailInvoiceBtn');
  if(emailBtn) emailBtn.addEventListener('click', ()=>{
    const t = calcInvoiceTotals(job.invoice);
    const biz = getBusinessDetails();
    const subject = `Invoice from ${biz.name||'your engineer'} — ${job.customerName}`;
    const body = `Hi ${job.customerName},\n\nPlease find your invoice for the ${job.jobType.toLowerCase()} on ${job.date||'(date)'}.\n\nTotal due: ${money(t.total)}\n\nA copy of the full invoice is attached — please attach the saved PDF before sending (use "Preview / print invoice" → Save as PDF).\n\nThanks,\n${biz.name||''}`;
    window.location.href = `mailto:${encodeURIComponent(customer.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });
}
function openPrintableInvoice(job, jobAppliances, customer){
  const biz = getBusinessDetails();
  const t = calcInvoiceTotals(job.invoice);
  const html = `
    <h1>Invoice ${job.invoice.status==='approved' ? '' : '(DRAFT)'}</h1>
    <p class="pr-note">${esc(biz.name)||'(business name not set)'} — this draft was prepared using Callout and should be checked before sending.</p>
    <table class="pr-table">
      <tr><th colspan="2">From</th><th colspan="2">Bill to</th></tr>
      <tr><td>Business</td><td>${esc(biz.name)}</td><td>Customer</td><td>${esc(job.customerName)}</td></tr>
      <tr><td>Address</td><td>${esc(biz.address)}</td><td>Address</td><td>${esc(job.address)}</td></tr>
      <tr><td>Phone</td><td>${esc(biz.phone)}</td><td>Email</td><td>${esc(customer && customer.email)}</td></tr>
      <tr><td>Reg No.</td><td>${esc(biz.regNumber)}</td><td>Date</td><td>${esc(job.date)}</td></tr>
    </table>
    <table class="pr-table">
      <tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr>
      ${job.invoice.lineItems.map(i=>`<tr><td>${esc(i.description)||'—'}</td><td>${esc(i.qty)}</td><td>${money(parseFloat(i.unitPrice)||0)}</td><td>${money((parseFloat(i.qty)||0)*(parseFloat(i.unitPrice)||0))}</td></tr>`).join('')}
    </table>
    <table class="pr-table">
      <tr><td>Subtotal</td><td>${money(t.subtotal)}</td></tr>
      ${job.invoice.vatEnabled ? `<tr><td>VAT (${esc(job.invoice.vatRate)}%)</td><td>${money(t.vat)}</td></tr>` : ''}
      <tr><td><strong>Total due</strong></td><td><strong>${money(t.total)}</strong></td></tr>
    </table>
    ${job.invoice.notes ? `<p class="pr-note">${esc(job.invoice.notes)}</p>` : ''}
  `;
  showDocumentPreview('Invoice preview', html);
}

render();
</script>

</body>
</html>
